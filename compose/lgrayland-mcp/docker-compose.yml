services:
  lgrayland-mcp:
    container_name: lgrayland-mcp
    build:
      context: ../../../workshop/lgrayland-mcp
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3100
      HOME_CONSOLE_URL: http://home-console:3000
      HOME_CONSOLE_ROOT: /projects/home-console
      MCP_API_TOKEN: ${MCP_API_TOKEN}
      NODE_ENV: production

    volumes:
      - ../../../workshop/home-console:/projects/home-console:ro

    ports:
      - "127.0.0.1:3100:3100"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      home-console:
        condition: service_healthy

    networks:
      - default
