services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $APPDATA/portainer:/data
    ports:
      # - 9443:9443
      - 9000:9000
