services:
  home-console:
    container_name: home-console
    build:
      context: ../../../workshop/home-console
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTOMATION_API_TOKEN: ${AUTOMATION_API_TOKEN}
      DATABASE_URL: ${HOME_CONSOLE_DATABASE_URL}
      KITCHEN_DATABASE_URL: ${HOME_CONSOLE_KITCHEN_DATABASE_URL}
      MCP_API_TOKEN: ${MCP_API_TOKEN}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${HOME_CONSOLE_PORT:-3031}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - automation
