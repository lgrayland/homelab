services:
  # Prowlarr - Torrent proxy
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # security_opt:
    #   - no-new-privileges:true
    restart: unless-stopped
    # profiles: ["apps", "all"]
    # networks:
    #   - t3_proxy
    ports:
      - "9696:9696"
    volumes:
      - $APPDATA/prowlarr:/config
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    networks:
      - default
