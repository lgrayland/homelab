services:
  freshrss:
    image: freshrss/freshrss:edge
    container_name: freshrss
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    volumes:
      - $APPDATA/freshrss/data:/var/www/FreshRSS/data
      - $APPDATA/freshrss/extensions:/var/www/FreshRSS/extensions
      - $APPDATA/freshrss/config.custom.php:/var/www/FreshRSS/data/config.custom.php
      - $APPDATA/freshrss/config-user.custom.php:/var/www/FreshRSS/data/config-user.custom.php
    ports:
      - "8083:80"
    environment:
      TZ: $TZ
      CRON_MIN: "2,32"
