services:
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      TZ: $TZ
    volumes:
      - $APPDATA/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_be005dd66e29ec118c636c7840c9ce8d-if00-port0:/dev/ttyACM0
